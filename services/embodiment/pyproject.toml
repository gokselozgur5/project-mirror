[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "project-mirror-embodiment"
version = "0.1.0"
description = "Safety boundary for Project Mirror embodiments"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.32,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/project_mirror_embodiment"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["project_mirror_embodiment"]
