name: Bug report
description: Report a reproducible software or hardware failure
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not upload private recordings, credentials, or biometric data.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include revision, configuration, and safe reproduction steps.
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Hardware involved
      options:
        - None / simulator
        - ESP32 without attached mechanism
        - Powered pan-tilt mechanism
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private media, credentials, and personal data.
          required: true
