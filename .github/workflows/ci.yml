name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ./scripts/check-repository.sh

  embodiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: uv.lock
      - run: python -m pip install uv==0.11.8
      - run: uv sync --locked --all-packages --all-extras
      - run: bash -n scripts/*.sh
      - run: uv run ruff format --check services scripts tests
      - run: uv run ruff check services/embodiment
      - run: uv run mypy services/embodiment/src
      - run: uv run pytest -q tests
      - run: uv run pytest -q services/embodiment
      - run: uv run ruff check services/runtime scripts tests
      - run: uv run mypy services/runtime/src
      - run: uv run pytest -q services/runtime
      - run: uv run ruff check services/perception
      - run: uv run mypy services/perception/src
      - run: uv run pytest -q services/perception
      - run: MIRROR_PYTHON="$(pwd)/.venv/bin/python" MIRROR_SOAK_MAX_P95_MS=100 ./scripts/run-phase1-stack-soak.sh 3 runtime/phase1-ci-smoke.json

  operator-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run build

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/head-controller/platformio.ini') }}
      - run: python -m pip install platformio==6.2.0
      - run: pio test -d firmware/head-controller -e native
      - run: pio run -d firmware/head-controller
