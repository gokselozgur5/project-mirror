name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/check-repository.sh

  embodiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/embodiment/pyproject.toml
      - run: python -m pip install -e 'services/embodiment[dev]'
      - run: python -m pip install -e 'services/runtime[dev]'
      - run: ruff check services/embodiment
      - run: mypy services/embodiment/src
      - run: pytest -q services/embodiment
      - run: ruff check services/runtime scripts
      - run: mypy services/runtime/src
      - run: pytest -q services/runtime
      - run: ./scripts/run-phase1-stack-soak.sh 3 runtime/phase1-ci-smoke.json

  operator-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/head-controller/platformio.ini') }}
      - run: python -m pip install platformio==6.2.0
      - run: pio test -d firmware/head-controller -e native
      - run: pio run -d firmware/head-controller
